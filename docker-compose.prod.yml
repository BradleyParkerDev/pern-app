version: '3.9'

services:
    app:
        image: pern-app-prod
        build:
            context: .
            dockerfile: Dockerfile
        container_name: pern-app-prod
        ports:
            - '3001:3001'
        env_file:
            - .env
        command: node app/server/dist/server/src/bin/www.js
        restart: unless-stopped
